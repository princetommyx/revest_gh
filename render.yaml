services:
  - type: web
    name: revesta-backend
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: python manage.py migrate && daphne -b 0.0.0.0 -p $PORT revesta_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # Daily re-engagement push notifications for inactive users.
  # NOTE: Render Cron Jobs are not on the free tier - pick a plan this
  # will actually run on. DATABASE_URL must be set to the SAME database
  # as revesta-backend above (not a new one), via the Render dashboard.
  - type: cron
    name: revesta-daily-reengagement
    runtime: python
    rootDir: backend
    plan: starter
    region: frankfurt
    schedule: "0 18 * * *" # 18:00 UTC daily (Ghana is UTC+0, no DST)
    buildCommand: bash build.sh
    startCommand: python manage.py send_daily_reengagement_notifications
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # Daily collector performance rollup - feeds intelligence.matching and the
  # cached rate fields on User. Same free-tier caveat as the cron above:
  # DATABASE_URL must point at the SAME database as revesta-backend.
  - type: cron
    name: revesta-collector-rollup
    runtime: python
    rootDir: backend
    plan: starter
    region: frankfurt
    schedule: "30 23 * * *" # 23:30 UTC daily - after most of the day's jobs are done
    buildCommand: bash build.sh
    startCommand: python manage.py rollup_collector_performance
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
