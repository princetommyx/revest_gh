services:
  - type: web
    name: revesta-backend
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: python manage.py migrate && daphne -b 0.0.0.0 -p $PORT revesta_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
