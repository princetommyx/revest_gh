name: Backend tests

# Runs the Django suite on every push and pull request. The suite exists to
# catch the class of bug this project keeps hitting - code that looks
# finished but silently does nothing (a payout that raises and is swallowed,
# a filter wired to state nothing sets, a count hardcoded to zero). That
# only works if it runs without anyone remembering to run it.

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Throwaway values: the suite runs against a temporary SQLite database
      # and never reaches a real service. Nothing here is a secret, and
      # nothing here is used outside this job.
      DEBUG: 'True'
      SECRET_KEY: ci-test-key-not-used-anywhere
      DATABASE_URL: 'sqlite:///ci-test.sqlite3'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        # A model change without its migration passes every test and then
        # breaks on deploy, so it is worth failing here instead.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity=2
