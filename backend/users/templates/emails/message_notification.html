<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Message Received</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation"
                    style="width: 600px; border-collapse: collapse; background-color: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                    <!-- Header -->
                    <tr>
                        <td
                            style="padding: 30px 40px; text-align: center; background-color: #f5f3ff; border-radius: 16px 16px 0 0; border-bottom: 2px solid #ddd6fe;">
                            <h2 style="margin: 0; font-size: 24px; font-weight: bold; color: #7c3aed;">
                                💬 New Message
                            </h2>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 1.6; color: #374151;">
                                Hello <strong>{{ user_name }}</strong>,
                            </p>
                            <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 1.6; color: #374151;">
                                You have received a new message from <strong>{{ sender_name }}</strong>:
                            </p>

                            <!-- Message Box -->
                            <div
                                style="background-color: #f9fafb; border-left: 4px solid #7c3aed; padding: 20px; border-radius: 4px; margin-bottom: 24px;">
                                <p
                                    style="margin: 0; font-size: 16px; line-height: 1.6; color: #4b5563; font-style: italic;">
                                    "{{ message_content }}"
                                </p>
                            </div>

                            <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 1.6; color: #374151;">
                                Open the ReVesta app to reply.
                            </p>

                            <div style="text-align: center; margin-top: 32px;">
                                <a href="{{ app_url }}"
                                    style="display: inline-block; padding: 12px 24px; background: linear-gradient(to right, #7c3aed, #4f46e5); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(124, 58, 237, 0.3);">
                                    Open App
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            style="padding: 24px 40px; background-color: #f9fafb; border-radius: 0 0 16px 16px; text-align: center; border-top: 1px solid #e5e7eb;">
                            <p style="margin: 0; font-size: 12px; color: #9ca3af;">
                                © {{ current_year }} {{ app_name }}. All rights reserved.<br>
                                You are receiving this email because you have notifications enabled.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
